name: Daily maintenance

on:
  schedule:
    # 20:30 UTC == 02:00 IST (UTC+5:30), every day
    - cron: "30 20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview the plan without committing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Baseline tests (abort if the repo is already broken)
        run: python -m pytest -q

      - name: Configure git identity
        env:
          AUTHOR_NAME: ${{ vars.COMMIT_AUTHOR_NAME }}
          AUTHOR_EMAIL: ${{ vars.COMMIT_AUTHOR_EMAIL }}
        run: |
          git config user.name "${AUTHOR_NAME:-github-actions[bot]}"
          git config user.email "${AUTHOR_EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"

      - name: Dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: python scripts/run_daily_maintenance.py --dry-run

      - name: Run daily maintenance (3-8 commits)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: python scripts/run_daily_maintenance.py

      - name: Push commits
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: git push origin "HEAD:${GITHUB_REF_NAME}"
